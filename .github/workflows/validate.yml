name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README claims: the oldest Python carrying
        # zoneinfo. Running both ends keeps that claim tested rather than
        # merely asserted.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Runs the exporter, Events.js and manifest checks. qmllint is absent
      # here, so the QML syntax check reports itself as skipped rather than
      # passing silently.
      - name: All tests
        run: ./tests/run-tests.sh
